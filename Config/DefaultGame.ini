; Temperate hills ecology: the runtime authority for species, density and slopes.
; Loaded once per process. Restart normally after editing; no live regeneration.
; Density multiplies each existing habitat probability (0 disables that layer).
; NormalZ = cos(slope degrees): larger values restrict planting to flatter ground.
; FullNormalZ is where slope density reaches full strength; equal values are a hard limit.
